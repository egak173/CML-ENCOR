lab:
  title: Week 05 OSPF
  description: Sanitized four-router OSPF ECMP and IP SLA lab
  notes: Clean startup configs; no exported PKI, secrets, or device-generated boilerplate.
  version: 0.3.0
annotations: []
smart_annotations: []
nodes:
  - id: n0
    label: r1
    node_definition: iol-xe
    x: -160
    y: -80
    configuration:
      - name: ios_config.txt
        content: |-
          hostname r1
          ip cef
          !
          interface Ethernet0/0
           description to-r2-Ethernet0/0
           ip address 10.0.12.1 255.255.255.252
           ip ospf network point-to-point
           ip ospf 1 area 0
           no shutdown
          !
          interface Ethernet0/1
           description to-r3-Ethernet0/0
           ip address 10.0.13.1 255.255.255.252
           ip ospf network point-to-point
           ip ospf 1 area 0
           ip ospf cost 5
           no shutdown
          !
          router ospf 1
           router-id 1.1.1.1
           passive-interface default
           no passive-interface Ethernet0/0
           no passive-interface Ethernet0/1
          !
          ip sla 10
           icmp-echo 172.16.100.1 source-ip 10.0.13.1
           threshold 400
           timeout 500
           frequency 1
          ip sla schedule 10 life forever start-time now
          !
          end
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: Ethernet0/0
        type: physical
        slot: 0
      - id: i2
        label: Ethernet0/1
        type: physical
        slot: 1
      - id: i3
        label: Ethernet0/2
        type: physical
        slot: 2
      - id: i4
        label: Ethernet0/3
        type: physical
        slot: 3
  - id: n1
    label: r2
    node_definition: iol-xe
    x: 40
    y: -280
